html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<script>
// The Last Attendance - native name field for phones. iPhone Safari opens its keyboard only when the user taps a real
// text box (a keyboard requested a frame later, from inside the game canvas, is silently refused). So while the
// late-entry register is open on a touch device, the game asks for a real <input> placed exactly over its name line.
(function () {
  var el = null;
  var st = { value: '', submitted: false, focused: false };
  window.__tlaField = st;
  function make() {
    el = document.createElement('input');
    el.type = 'text';
    el.autocomplete = 'off';
    el.spellcheck = false;
    el.setAttribute('autocapitalize', 'characters');
    el.setAttribute('autocorrect', 'off');
    el.setAttribute('enterkeyhint', 'done');
    el.style.cssText = 'position:fixed;z-index:10;display:none;box-sizing:border-box;margin:0;border:0;' +
      'border-bottom:3px solid #807359;border-radius:0;background:#f7f2db;color:#050508;padding:0 8px;outline:none;' +
      '-webkit-appearance:none;appearance:none;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;';
    el.addEventListener('input', function () { st.value = el.value; });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { st.value = el.value; st.submitted = true; el.blur(); e.preventDefault(); }
    });
    el.addEventListener('focus', function () { st.focused = true; });
    el.addEventListener('blur', function () { st.focused = false; setTimeout(function () { window.scrollTo(0, 0); }, 50); });
    document.body.appendChild(el);
  }
  // x, y, w, h in game-window (device) pixels
  st.show = function (x, y, w, h, max, placeholder) {
    if (!el) make();
    var c = document.querySelector('canvas');
    var r = c.getBoundingClientRect();
    var k = r.width / (c.width || r.width);
    el.maxLength = max;
    el.placeholder = placeholder;
    el.style.left = (r.left + x * k) + 'px';
    el.style.top = (r.top + y * k) + 'px';
    el.style.width = (w * k) + 'px';
    el.style.height = (h * k) + 'px';
    el.style.fontSize = Math.max(16, Math.round(h * k * 0.5)) + 'px';   // >= 16 px: Safari does not zoom the page
    el.style.display = 'block';
  };
  st.set = function (v) { st.value = v; if (el && el.value !== v) el.value = v; };
  st.hide = function () { if (el) { el.blur(); el.style.display = 'none'; el.value = ''; } st.value = ''; st.submitted = false; };
  st.take = function () { var s = st.submitted; st.submitted = false; return s; };
})();

<script>
// Test builds only (?debug=1): copy everything the game sends to the speakers into an analyser, so a browser test can
// measure the real output level (window.__tlaOutputDb). On the web Godot plays sounds as Web Audio samples, so its own
// bus meters do not see them.
if (/[?&]debug=1/.test(location.search)) (function () {
  var connect = AudioNode.prototype.connect;
  window.__tlaAnalysers = [];
  AudioNode.prototype.connect = function (dest) {
    var r = connect.apply(this, arguments);
    try {
      if (dest instanceof AudioDestinationNode) {
        var ctx = this.context;
        if (!ctx.__tlaAn) {
          var an = ctx.createAnalyser();
          an.fftSize = 4096;
          var silent = ctx.createGain();
          silent.gain.value = 0;
          connect.call(an, silent);
          connect.call(silent, ctx.destination);
          ctx.__tlaAn = an;
          window.__tlaAnalysers.push(an);
        }
        connect.call(this, ctx.__tlaAn);
      }
    } catch (e) {}
    return r;
  };
  window.__tlaOutputDb = function () {
    var best = -200;
    window.__tlaAnalysers.forEach(function (an) {
      var b = new Float32Array(an.fftSize);
      an.getFloatTimeDomainData(b);
      var sum = 0;
      for (var i = 0; i < b.length; i++) sum += b[i] * b[i];
      var rms = Math.sqrt(sum / b.length);
      if (rms > 0) best = Math.max(best, 20 * Math.log10(rms));
    });
    return best;
  };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":6356892,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
